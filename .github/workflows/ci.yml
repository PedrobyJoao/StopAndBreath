# PRs to main: test and build an unsigned production APK.
# don't forget to add branch rules, unallow direct commit to main
#
# Releases: after merging, push vX.Y matching app versionName
# in app/build.gradle.kts.
#
# Tags must reference a commit on main; tests/build must pass
# before production signing and publishing to GitHub Releases.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Tests and build APK
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # actions/checkout v6.0.2
      - uses: "actions/checkout@\
          de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record built commit and validate release tags
        id: commit
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [[ "$REF_TYPE" == tag ]] || exit 0
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' \
            app/build.gradle.kts)
          number='(0|[1-9][0-9]*)'
          pattern="^v${number}[.]${number}$"
          [[ "$TAG" =~ $pattern && "${TAG#v}" == "$version" ]] || {
            echo '::error::Expected vX.Y matching app versionName'
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main || {
            echo '::error::Release commit must be merged into main'
            exit 1
          }
      # actions/setup-java v5.2.0
      - uses: "actions/setup-java@\
          be666c2fcd27ec809703dec50e508c2fdc7f6654"
        with:
          distribution: temurin
          java-version: '17'
      # gradle/actions/setup-gradle v5.0.2
      - uses: "gradle/actions/setup-gradle@\
          0723195856401067f7a2779048b490ace7a47d7c"
        with:
          cache-disabled: true
      # android-actions/setup-android v4
      - name: Set up Android SDK
        uses: "android-actions/setup-android@\
          be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd"
      - name: Install Android SDK packages
        run: >-
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests and build APK
        run: >-
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      # actions/upload-artifact v6.0.0
      - uses: "actions/upload-artifact@\
          b7c566a772e6b6bfb58ed0dc250532a479d7789f"
        with:
          name: unsigned-production-apk
          path: >-
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download this run's APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          gh run download "$RUN_ID" --name unsigned-production-apk
          --dir release-apk
      # actions/setup-java v5.2.0
      - uses: "actions/setup-java@\
          be666c2fcd27ec809703dec50e508c2fdc7f6654"
        with:
          distribution: temurin
          java-version: '17'
      # android-actions/setup-android v4
      - name: Set up Android SDK
        uses: "android-actions/setup-android@\
          be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd"
      - name: Install signing tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Sign and verify the production APK
        env:
          SIGNING_KEYSTORE_BASE64: >-
            ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: >-
            ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${SIGNING_KEYSTORE_BASE64:?Missing signing keystore}"
          : "${SIGNING_STORE_PASSWORD:?Missing store password}"
          : "${SIGNING_KEY_ALIAS:?Missing key alias}"
          : "${SIGNING_KEY_PASSWORD:?Missing key password}"
          keystore=$(mktemp "$RUNNER_TEMP/signing.XXXXXX.p12")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" |
            base64 --decode > "$keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 4 \
            release-apk/app-release-unsigned.apk \
            release-apk/app-aligned.apk
          "$tools/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out release-apk/app-release.apk \
            release-apk/app-aligned.apk
          "$tools/apksigner" verify --verbose --print-certs \
            release-apk/app-release.apk
      - name: Publish the existing tag's production APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="repos/$GH_REPO"
          actual=$(gh api "$api/commits/refs/tags/$TAG" --jq .sha)
          [[ "$actual" == "$BUILD_SHA" ]] || {
            echo '::error::Tag no longer matches the built commit'
            exit 1
          }
          apk="stop-and-breathe-$TAG.apk"
          test -s release-apk/app-release.apk
          mv release-apk/app-release.apk "$apk"
          notes='Production-signed APK for direct installation.'
          notes+=$'\nBuilt commit: '"$BUILD_SHA"
          gh release create "$TAG" \
            "$apk#Production APK" \
            --verify-tag --title "$TAG" --notes "$notes"
